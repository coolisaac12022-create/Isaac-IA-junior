<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aelyra, Jeanette, Onyx & Aegis — Les quatre agentes de Isaac</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Écran de démarrage -->
<div id="boot">
  <div class="boot-core"></div>
  <div class="boot-lines" id="bootLines"></div>
</div>

<!-- Fond HUD -->
<div class="grid-bg"></div>
<div class="scanline"></div>

<!-- Barre supérieure -->
<header class="hud-top">
  <div class="hud-left">
    <span class="dot online" id="serverDot"></span> <span id="serverStatus">SYSTÈMES EN LIGNE</span>
  </div>
  <div class="hud-title">
    <div id="hudTitle">AELYRA</div>
    <div class="agent-switch" id="agentSwitch">
      <button id="btnAelyra" class="sw active">AELYRA</button>
      <button id="btnJeanette" class="sw sw-gk">JEANETTE</button>
      <button id="btnOnyx" class="sw sw-onyx">ONYX</button>
      <button id="btnAegis" class="sw sw-aegis">AEGIS</button>
    </div>
  </div>
  <div class="hud-right"><button id="soundBtn" class="sound-btn" title="Couper ou activer la voix">🔊</button> <span id="clock">--:--</span></div>
</header>

<!-- Réacteur -->
<main class="stage">
  <div class="reactor-wrap">
    <div class="ring ring-outer"></div>
    <div class="ring ring-mid"></div>
    <div class="ring ring-inner"></div>
    <div class="ring ring-dashed"></div>
    <div class="ticks" id="ticks"></div>
    <button id="reactor" class="core" title="Cliquer pour parler à Aelyra ou Jeanette">
      <div class="core-glow"></div>
      <div class="core-center"></div>
    </button>
  </div>
  <div id="status" class="status">Initialisation...</div>
</main>

<!-- Journal de conversation -->
<section class="log-panel">
  <div class="log-head">
    <span>JOURNAL DE COMMUNICATION</span>
    <div class="log-tools">
      <label class="wake-toggle">
        <input type="checkbox" id="wakeMode">
        <span>Mode veille</span>
      </label>
      <button id="voixBtn" class="zoom-btn" title="La voix de chaque agente : choisir, régler, écouter">🗣</button>
      <button id="logZoom" class="zoom-btn" title="Agrandir ou réduire le journal (ou tirez le bord du journal)">⤢</button>
      <a id="ccBtn" class="zoom-btn" href="command-center.html" title="Ouvrir le JARVIS COMMAND CENTER : noyau holographique, mesures réelles, agentes, missions">◈</a>
    </div>
  </div>
  <div id="voixPanneau" class="voix-panneau" hidden></div>
  <div id="log" class="log"></div>
  <div id="imgPreview" class="img-preview" hidden>
    <img id="imgThumb" alt="aperçu de l'image jointe">
    <span id="imgName">image jointe</span>
    <button type="button" id="imgRemove" title="Retirer l'image">✕</button>
  </div>
  <form id="cmdForm" class="cmd-bar">
    <input type="file" id="imgFile" accept="image/*" hidden>
    <button type="button" id="imgBtn" class="attach-btn" title="Joindre une image (ou Ctrl+V)">📎</button>
    <button type="button" id="micBtn" class="mic-btn" title="Parler">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
        <path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3z"/>
        <path d="M19 11a7 7 0 0 1-14 0H3a9 9 0 0 0 8 8.94V22h2v-2.06A9 9 0 0 0 21 11h-2z"/>
      </svg>
    </button>
    <input id="cmdInput" type="text" placeholder="Écrivez un ordre... ex : « ouvre youtube », « quelle heure est-il ». Image ? 📎 ou Ctrl+V, puis posez votre question." autocomplete="off">
    <button type="submit" class="send-btn" title="Envoyer">➤</button>
  </form>
</section>

<script src="three.min.js"></script>
<script src="avatar3d.js"></script>
<script src="app.js"></script>
</body>
</html>
